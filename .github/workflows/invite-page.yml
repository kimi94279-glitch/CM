name: Invite Page

# web/ (초대 웹 페이지) → GitHub Pages 배포.
# 주소: https://kimi94279-glitch.github.io/CM/invite/?code=…  (src/constants/config.ts INVITE_WEB_URL)
# 처음 한 번 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 켜야 한다.

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/invite-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
