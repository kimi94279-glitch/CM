<!doctype html>
<!-- 앱 아이콘 원본(손으로 그린 선 아이콘 한 벌) — 24×24 격자, 선 1.9, 둥근 끝. 이모지·유니코드 기호 아이콘을 대신한다(2026-10-31).
     scripts/build-icons.py 가 이 페이지를 칸별로 잘라 assets/icons/*.png(1x·2x·3x, 알파 = 선)로 굽는다. 앱에서는 <Icon> 이 tintColor 로 칠한다. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(6, 96px); }
  .cell { width: 96px; height: 96px; display: grid; place-items: center; }
  svg { width: 72px; height: 72px; fill: none; stroke: #000; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
// 이름 순서 = 칸 순서(왼→오, 위→아래). 이름을 바꾸면 build-icons.py 의 목록도 같이.
var ICONS = [
  ['back', '<path d="M15 5 8 12l7 7"/>'],
  ['close', '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'],
  ['search', '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/>'],
  ['fold', '<path d="M3 6.2 9 4l6 2.2L21 4v13.8L15 20l-6-2.2L3 20z"/><path d="M9 4v13.8M15 6.2V20"/>'],

  ['pencil', '<path d="M4.5 19.5 5.6 15 15.6 5a2 2 0 0 1 2.9 0l.5.5a2 2 0 0 1 0 2.9L9 18.4z"/><path d="M13.6 7l3.4 3.4M5.6 15 9 18.4"/>'],
  ['pen', '<path d="M7 10.2 12 3l5 7.2-2.6 7.6H9.6z"/><path d="M12 3v7.4"/><circle cx="12" cy="12.1" r="1.3"/><path d="M9.8 17.8v3.2h4.4v-3.2"/>'],
  ['marker', '<path d="M14.6 3.6l5.8 5.8L11 18.8H6.2V14z"/><path d="M12.6 5.6l5.8 5.8"/><path d="M3.5 21h9"/>'],
  ['string', '<circle cx="5" cy="7" r="2.2"/><circle cx="19" cy="7" r="2.2"/><path d="M5.6 9.1C8 17 16 17 18.4 9.1"/><path d="M9.2 13.9l-.6 1.4M12 15.1v1.5M14.8 13.9l.6 1.4"/>'],
  ['sticker', '<path d="M12 3.6l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.7-5 2.7.9-5.6-4-3.9 5.6-.8z"/>'],
  ['pin', '<circle cx="12" cy="8" r="4.6"/><path d="M12 12.6V21"/><path d="M10.1 6.6a2.1 2.1 0 0 1 1.7-1.1"/>'],
  ['undo', '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-4"/>'],
  ['compass', '<circle cx="12" cy="12" r="8.2"/><path d="M14.8 9.2l-1.6 4-4 1.6 1.6-4z"/><path d="M12 2.4v1.6M12 20v1.6M2.4 12h1.6M20 12h1.6"/>'],
  ['minus', '<path d="M5 12h14"/>'],
  ['plus', '<path d="M12 5v14M5 12h14"/>'],

  ['more', '<circle cx="6" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="18" cy="12" r=".9"/>'],

  ['check', '<path d="M5 12.6l4.6 4.4L19 7.4"/>'],
  ['forward', '<path d="M9 5l7 7-7 7"/>'],

  ['stamp', '<path d="M5.5 4h13v16h-13z" stroke-dasharray="1.1 1.7"/><path d="M8 7h8v8.6H8z"/><path d="M8.4 15l2.6-3.4 1.8 2 1.4-1.6 1.8 2.3"/><circle cx="14" cy="9.4" r=".9"/>'],
  // 지도 바탕 고르기: 겹쳐 놓은 종이 지도 세 장
  ['layers', '<path d="M12 3.6 3.4 8.2 12 12.8l8.6-4.6z"/><path d="M3.4 12.2 12 16.8l8.6-4.6"/><path d="M3.4 16.2 12 20.8l8.6-4.6"/>'],
];
var grid = document.getElementById('grid');
ICONS.forEach(function (it) {
  var c = document.createElement('div');
  c.className = 'cell';
  c.title = it[0];
  c.innerHTML = '<svg viewBox="0 0 24 24">' + it[1] + '</svg>';
  grid.appendChild(c);
});
window.ICON_NAMES = ICONS.map(function (i) { return i[0]; });
</script>
</body>
</html>
